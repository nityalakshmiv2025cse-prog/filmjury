spring.application.name=flimjury

# MySQL: the database is created automatically if it does not exist.
# Change the password below if your MySQL root password is different.
spring.datasource.url=jdbc:mysql://localhost:3306/filmjury?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:your_password_here}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Adds demo entries, judges and scores on first start (only when the database is empty).
filmjury.seed-demo-data=true
